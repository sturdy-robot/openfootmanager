name: publish-nightly

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional nightly tag override
        required: false
        type: string
  push:
    branches:
      - develop

# Every build shares the one rolling `nightly` tag, so runs must not overlap.
concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_settings.outputs.tag }}
      display_version: ${{ steps.release_settings.outputs.display_version }}
      release_name: ${{ steps.release_settings.outputs.release_name }}
      release_body: ${{ steps.release_settings.outputs.release_body }}
      archive_tag: ${{ steps.release_settings.outputs.archive_tag }}
      archive_name: ${{ steps.release_settings.outputs.archive_name }}
      archive_body: ${{ steps.release_settings.outputs.archive_body }}
    steps:
      # Read-only job: reads tauri.conf.json and calls gh api via GH_TOKEN, never
      # touches git, so the checkout credentials are not needed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve nightly release metadata
        id: release_settings
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          # Fixed rolling tag, replaced in place, so "the latest nightly" always
          # has one stable URL no matter how GitHub sorts the releases page.
          tag="${INPUT_RELEASE_TAG:-nightly}"
          nightly_date="$(date -u +%F)"
          compact_date="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          base_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          display_version="${base_version}-nightly.${compact_date}+${short_sha}"

          # The date/sha live in the release name because a rolling tag's
          # published_at never advances.
          release_name="Openfoot Manager Nightly ${display_version}"

          # Alongside the rolling tag, every push also leaves a permanent archive
          # release behind. GitHub orders the releases page by the target commit's
          # *date* and then by tag string, not by publish time, so a tag ending in
          # a bare sha shuffles same-day builds into a random order — which is why
          # the old `nightly-develop-<date>-<sha>` scheme was abandoned. A UTC
          # timestamp makes tag order and build order the same thing.
          #
          # One clock read, reused: a second `date -u` here could straddle a
          # second boundary and stamp the tag differently from the title.
          build_stamp="$(date -u +%Y%m%d-%H%M%S)"
          archive_tag="nightly-${build_stamp}-${short_sha}"
          # `T` rather than `.` keeps this a valid SemVer alphanumeric identifier;
          # a time like `043512` would be an invalid numeric one (leading zero).
          archive_version="${base_version}-nightly.${build_stamp/-/T}+${short_sha}"
          archive_name="Openfoot Manager Nightly ${archive_version}"

          compare_line=""
          last_stable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "$last_stable" ]; then
            compare_line="Changes since \`${last_stable}\`: https://github.com/${GITHUB_REPOSITORY}/compare/${last_stable}...${GITHUB_SHA}"
          fi

          {
            echo "tag=$tag"
            echo "display_version=$display_version"
            echo "release_name=$release_name"
            echo "release_body<<EOF"
            echo "Rolling nightly build from \`develop\` — **unstable**, expect breakage."
            echo ""
            echo "- Version: \`${display_version}\`"
            echo "- Commit: \`${short_sha}\`"
            echo "- Built: ${nightly_date} (UTC)"
            if [ -n "$compare_line" ]; then
              echo ""
              echo "$compare_line"
            fi
            echo ""
            echo "This tag is replaced on every push to \`develop\`; the assets below always reflect the newest build."
            echo ""
            echo "Older builds are kept as \`nightly-<date>-<time>-<commit>\` releases."
            echo "EOF"
            echo "archive_tag=$archive_tag"
            echo "archive_name=$archive_name"
            echo "archive_body<<EOF"
            echo "Archived nightly build from \`develop\` — **unstable**, expect breakage."
            echo ""
            echo "- Version: \`${archive_version}\`"
            echo "- Commit: \`${short_sha}\`"
            echo "- Built: ${nightly_date} (UTC)"
            echo ""
            echo "A snapshot of one commit, kept for history. Unlike [\`${tag}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}) it is never replaced — and never updated either, so it will fall behind."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  publish-tauri-nightly:
    needs: prepare-nightly
    environment: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bakes the channel into the bundled frontend so the in-app version
          # reads "v0.3.0-nightly · <sha>" instead of looking like a stable build.
          OFM_CHANNEL: nightly
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-nightly.outputs.tag }}
          releaseName: ${{ needs.prepare-nightly.outputs.release_name }}
          releaseBody: ${{ needs.prepare-nightly.outputs.release_body }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      # The bundles are already on this runner, so each platform copies its own
      # into the archive release. Downloading them again in a central job would
      # move the same few hundred megabytes twice for no gain, and would archive
      # whatever happens to be attached to the rolling release — including a
      # stale binary left there by an earlier build. Copying from source means an
      # archive holds exactly what this run produced.
      - name: Publish assets to the per-build nightly archive
        # macOS ships bash 3.2, so nothing here may use bash 4 builtins.
        # The Windows leg defaults to pwsh, hence the explicit shell.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_TAG: ${{ needs.prepare-nightly.outputs.archive_tag }}
          ARCHIVE_NAME: ${{ needs.prepare-nightly.outputs.archive_name }}
          ARCHIVE_BODY: ${{ needs.prepare-nightly.outputs.archive_body }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail

          # Bundle filenames contain spaces ("Openfoot Manager_0.3.0_amd64.deb"),
          # so the JSON array is read one path per line rather than word-split.
          #
          # `tr -d '\r'` is not cosmetic. Tauri's bundler prints its "Finished N
          # bundles at:" list with CRLF on Windows and tauri-action splits it on
          # \n alone, so every artifactPaths entry *except the last* arrives with
          # a trailing carriage return. The path then resolves for nothing —
          # which is why the .msi (first) was unreachable while the .exe (last)
          # uploaded fine, and why `gh` printed its closing backtick on the next
          # line.
          paths="$(jq -r '.[]' <<<"${ARTIFACT_PATHS:-[]}" | tr -d '\r')"
          if [ -z "$paths" ]; then
            echo "This platform produced no bundles; nothing to archive."
            exit 0
          fi

          # Created lazily by whichever platform gets here first — and only once
          # there is something to put in it, so a run cancelled before any build
          # finishes strands nothing. A losing racer's create fails with "already
          # exists", which is the state it wanted anyway.
          if ! gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$ARCHIVE_NAME" \
              --notes "$ARCHIVE_BODY" \
              --prerelease || true
          fi

          printf '%s\n' "$paths" | while IFS= read -r path; do
            [ -n "$path" ] || continue

            # Windows emits backslash paths, and `gh release upload` glob-expands
            # its argument there — in a glob, `\` is an escape character, so the
            # path dissolves into a pattern that matches nothing. Forward slashes
            # work on every platform.
            path="${path//\\//}"

            # artifactPaths is not all files: on macOS it lists the `.app` bundle
            # directory, which tauri-action tars up itself before uploading. gh
            # cannot upload a directory, so the archive carries the `.dmg` but not
            # the `.app.tar.gz` updater payload — which an immutable snapshot has
            # no use for anyway.
            #
            # Deliberately `-d` and not `! -f`: an earlier `! -f` guard here
            # swallowed the carriage-return bug above, silently dropping the .msi
            # while the job stayed green. Testing only for the case actually being
            # excluded means anything else reaches the checks below and fails.
            if [ -d "$path" ]; then
              echo "Skipping bundle directory: $path"
              continue
            fi

            # An artifact tauri-action uploaded seconds ago should still be here.
            # Kept as a tripwire: `gh` answers an unresolvable path with "no
            # matches found", which reads like a glob bug and cost two rounds of
            # debugging. The listing says whether the file or the string is wrong.
            if [ ! -e "$path" ]; then
              echo "::error::Artifact listed by tauri-action is missing: $path"
              ls -l "$(dirname "$path")" || true
              exit 1
            fi

            gh release upload "$ARCHIVE_TAG" "$path" --clobber
          done

  # The `nightly` release is upserted, never deleted: a failed build must not
  # destroy the last known-good nightly. The cost is that re-uploading assets to
  # an existing release does not re-fire `release: published`, so the metadata
  # pipeline is dispatched explicitly here.
  finalize-nightly:
    needs: [prepare-nightly, publish-tauri-nightly]
    # `fail-fast: false` means one platform can fail while the others upload new
    # assets. Finalizing anyway keeps the release name and, more importantly, the
    # published checksums consistent with the assets that *did* land — skipping
    # would leave nightly-checksums.txt describing files that no longer exist.
    if: ${{ !cancelled() && needs.prepare-nightly.result == 'success' && needs.publish-tauri-nightly.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      # contents:write to force-move the rolling tag and edit the release below;
      # actions:write to dispatch nightly-release-manifest.yml.
      contents: write
      actions: write
    steps:
      # persist-credentials stays on (the default): the git push below relies on
      # the credential helper this step configures.
      - uses: actions/checkout@v4

      - name: Move rolling tag and refresh release metadata
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare-nightly.outputs.release_name }}
          RELEASE_BODY: ${{ needs.prepare-nightly.outputs.release_body }}
        run: |
          set -euo pipefail

          # Nothing to finalize if every platform failed and the release was
          # never created.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No $RELEASE_TAG release exists — every build must have failed."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_BODY" \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Dispatch nightly metadata workflow
        if: ${{ steps.finalize.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-nightly.outputs.display_version }}
        run: |
          set -euo pipefail
          gh workflow run nightly-release-manifest.yml \
            -f release_tag="$RELEASE_TAG" \
            -f release_version="$RELEASE_VERSION"

  # `cancel-in-progress` kills this run the moment a newer push lands, and by then
  # the archive release may already hold two of five platforms — a build that
  # never really existed, presented as history. `always()` is the only condition
  # that still runs after a cancellation; `!cancelled()`, used above, does not.
  cleanup-nightly-archive:
    needs: [prepare-nightly, publish-tauri-nightly]
    if: ${{ always() && needs.prepare-nightly.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: gh talks to the API directly, and GH_REPO tells it where.
      - name: Drop superseded or empty archive releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE_TAG: ${{ needs.prepare-nightly.outputs.archive_tag }}
          BUILD_RESULT: ${{ needs.publish-tauri-nightly.result }}
        run: |
          set -euo pipefail

          if ! gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then
            echo "No $ARCHIVE_TAG release to clean up (result=$BUILD_RESULT)."
            exit 0
          fi

          asset_count="$(gh release view "$ARCHIVE_TAG" --json assets --jq '.assets | length')"

          if [ "$BUILD_RESULT" != "cancelled" ] && [ "$asset_count" -gt 0 ]; then
            echo "Keeping $ARCHIVE_TAG ($asset_count assets, result=$BUILD_RESULT)."
            exit 0
          fi

          # --cleanup-tag: `gh release create` created the tag, so deleting the
          # release on its own would leave it dangling.
          gh release delete "$ARCHIVE_TAG" --cleanup-tag --yes
          echo "Deleted $ARCHIVE_TAG (result=$BUILD_RESULT, assets=$asset_count)."
