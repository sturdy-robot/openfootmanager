name: win-real-app

# Scratch (fork only, never merged): the World Editor on a very large package, in the real app on Windows
# (WebView2), driven by tauri-driver + msedgedriver. The runner is a throwaway VM. Two builds are compared:
# before (nightly-20261102-a4c69c3, what the users ran, BUILT here: the published installer's WebView2 ignores
# the debugging port variable, so it cannot be attached to) and after (current develop, built here). Both builds
# get `additionalBrowserArgs: --remote-debugging-port=9222` in their window config and nothing else. The package is a synthetic replica; the real
# package is never in this repository or on this runner.
on:
  push:
    branches: [scratch/win-real-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        build: [before, after]
    steps:
      - name: Checkout the harness (this branch)
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout the app (${{ matrix.build }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.build == 'before' && 'cloud-src/ofm-perf/real-app-a4c69c3' || 'cloud-src/ofm-perf/real-app-after' }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versions (Edge, WebView2 runtime)
        shell: pwsh
        run: |
          node --version; python --version
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, TotalVisibleMemorySize
          systeminfo | Select-String "Total Physical Memory"

      - name: Open the window's WebView2 to the debugging port (the only change to the app)
        shell: pwsh
        working-directory: app
        run: |
          $path = "src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--remote-debugging-port=9222 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection" -Force
          $conf | ConvertTo-Json -Depth 30 | Set-Content $path
          git diff --stat
          git rev-parse HEAD

      - name: Trace read_package_project to a file (Rust side)
        shell: pwsh
        run: python harness/win-e2e/patch_trace.py app/src-tauri/src/commands/package_editor.rs

      - name: Reuse the built app of this ref, if built before
        id: exe
        uses: actions/cache@v4
        with:
          path: app/src-tauri/target/debug/openfootmanager.exe
          key: exe-${{ matrix.build }}-${{ hashFiles('harness/.github/workflows/win-real-app.yml', 'harness/win-e2e/patch_trace.py') }}-v2

      - name: Build the app (debug, frontend embedded)
        if: steps.exe.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: app
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          npm ci
          npm run tauri build -- --debug --no-bundle
          Write-Host "BUILD seconds=$($sw.Elapsed.TotalSeconds)"
          Get-Item src-tauri/target/debug/openfootmanager.exe | Select-Object FullName, Length

      - name: Where the app is
        shell: pwsh
        working-directory: app
        run: |
          "OFM_APP_EXE=$((Resolve-Path src-tauri/target/debug/openfootmanager.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: tauri-driver and msedgedriver
        shell: pwsh
        working-directory: harness/win-e2e
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          Get-ChildItem msedgedriver.exe
          .\msedgedriver.exe --version

      - name: Install the suite
        shell: pwsh
        working-directory: harness/win-e2e
        run: npm install

      - name: A small package (3 countries, 600 players, 20 crests), the same generator
        shell: pwsh
        env:
          SYNTH_COUNTRIES: "3"
          SYNTH_PLAYERS: "600"
          SYNTH_ASSETS: "20"
        run: |
          python harness/win-e2e/synth_mega.py "$env:RUNNER_TEMP\synth-small"
          (Get-ChildItem "$env:RUNNER_TEMP\synth-small" -Recurse -File | Measure-Object Length -Sum).Sum

      - name: The synthetic replica (581 clubs, 17,098 players, 45 competitions)
        shell: pwsh
        run: |
          python harness/win-e2e/synth_mega.py "$env:RUNNER_TEMP\synth"
          (Get-ChildItem "$env:RUNNER_TEMP\synth" -Recurse -File | Measure-Object Length -Sum).Sum

      - name: Run the session twice
        id: run
        continue-on-error: true
        shell: pwsh
        working-directory: harness/win-e2e
        run: |
          $driver = (Resolve-Path .\msedgedriver.exe).Path
          $app = $env:OFM_APP_EXE
          foreach ($run in @(@("1","synth"), @("2","synth"), @("small","synth-small"))) {
            $n = $run[0]
            $project = "$env:RUNNER_TEMP\proj-$n"
            Copy-Item "$env:RUNNER_TEMP\$($run[1])" $project -Recurse
            $env:OFM_APP = $app
            $env:OFM_DRIVER = $driver
            $env:OFM_PERF_PROJECT = $project
            $env:OFM_PERF_LOG = "$PWD\steps-${{ matrix.build }}-$n.log"
            $env:OFM_TRACE_FILE = "$PWD\rust-trace-${{ matrix.build }}-$n.log"
            $env:OFM_PERF_BUILD_OUT = "$env:RUNNER_TEMP\out-$n\mega.ofm"
            Write-Host "=== RUN $n ($($run[1]))"
            npx wdio run wdio.conf.mjs 2>&1 | Tee-Object -FilePath "wdio-${{ matrix.build }}-$n.log"
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'openfoot|msedgewebview2|msedgedriver|tauri-driver' } | Stop-Process -Force
            Start-Sleep -Seconds 5
          }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-real-app-${{ matrix.build }}
          path: |
            harness/win-e2e/*.log
          if-no-files-found: warn
