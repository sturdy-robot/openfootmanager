[tool.poetry]
name = "openfootmanager"
version = "0.1.0"
description = "A free and open source football manager game."
authors = ["sturdy-robot <pedrenriquegg@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
ttkbootstrap = "^1.10.1"
pyyaml = "^6.0.1"
flask = "^3.0.3"
pytailwindcss = "^0.2.0"
sqlalchemy = "^2.0.36"
pydantic = "^2.9.2"
fastapi = "^0.115.5"
sqlmodel = "^0.0.22"
uvicorn = "^0.32.0"
pywebview = "^5.3.2"
qtpy = "^2.4.2"
pyside2 = "^5.15.2.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
hypothesis = "^6.104.2"
pre-commit = "^3.7.1"
isort = "^5.13.2"
black = "^24.4.2"
flake8 = "^7.1.0"
sphinx = "^7.3.7"
pygments = "^2.18.0"
docutils = "^0.21.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
