repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: no-commit-to-branch # Example: prevent committing directly to main/master
        args: [--branch, main, --branch, master]

  - repo: https://github.com/rust-lang/rustfmt
    rev: master # Or a specific commit hash for stability
    hooks:
      - id: rustfmt

  - repo: https://github.com/cargo-precommit/cargo-precommit
    rev: v0.2.2 # Use the latest stable version
    hooks:
      - id: cargo-check
      - id: cargo-fmt
      - id: cargo-clippy