<!DOCTYPE html>
<html lang="en" x-data="{
  darkMode: localStorage.getItem('darkMode')
    ? JSON.parse(localStorage.getItem('darkMode'))
    : window.matchMedia('(prefers-color-scheme: dark)').matches,
  toggleDarkMode() {
    this.darkMode = !this.darkMode;
    localStorage.setItem('darkMode', JSON.stringify(this.darkMode));
  }
  }" :class="{'dark' : darkMode, '' : !darkMode}"
  x-init="$watch('darkMode', value => document.documentElement.classList.toggle('dark', value))">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openfoot Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='img/favicon.ico') }}" />
  <script src=" {{ url_for('static', path='js/htmx.min.js') }}"></script>
  <script src="{{ url_for('static', path='js/alpine.min.js') }}" defer></script>
</head>

<body class="bg-gray-50 text-black dark:bg-slate-800 dark:text-white">
  {% block content %}
  {% endblock %}
</body>

</html>
